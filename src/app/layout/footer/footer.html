<footer class="relative overflow-hidden border-t border-border bg-surface">
  <div
    class="pointer-events-none absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-accent/40 to-transparent"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -top-32 left-1/2 h-64 w-[36rem] -translate-x-1/2 rounded-full bg-accent/10 blur-[100px]"
    aria-hidden="true"
  ></div>

  <div class="container-page relative py-16">
    <div class="flex flex-col gap-12 sm:flex-row sm:items-start sm:gap-20">
      <div class="max-w-xs">
        <a
          routerLink="/"
          class="inline-flex items-center gap-2.5 transition-opacity hover:opacity-80 focus-visible:outline-2"
          aria-label="letusdeliver — home"
        >
          <img src="/images/logo-mark.png" alt="" width="32" height="32" class="h-8 w-auto" />
          <p class="font-display text-xl font-semibold text-primary-text">letusdeliver</p>
        </a>
        <p class="mt-3 text-sm leading-relaxed text-secondary-text">{{ tagline }}</p>
        <p class="mt-5 font-display text-xs font-semibold uppercase tracking-[0.3em] text-muted-text">{{ brandTagline }}</p>
      </div>

      <div class="flex flex-wrap gap-x-16 gap-y-10">
        <div>
          <h3 class="text-xs font-semibold uppercase tracking-wider text-muted-text">Site</h3>
          <ul class="mt-4 space-y-3">
            @for (link of links; track link.path) {
              <li>
                <a
                  [routerLink]="link.path"
                  class="group relative inline-flex items-center text-sm text-secondary-text transition-colors hover:text-primary-text"
                >
                  {{ link.label }}
                  <span
                    class="absolute -bottom-0.5 left-0 h-px w-full origin-left scale-x-0 bg-accent-bright transition-transform duration-300 ease-out group-hover:scale-x-100"
                  ></span>
                </a>
              </li>
            }
          </ul>
        </div>

        @if (socialLinks.length) {
          <div>
            <h3 class="text-xs font-semibold uppercase tracking-wider text-muted-text">Elsewhere</h3>
            <ul class="mt-4 space-y-3">
              @for (item of socialLinks; track item.key) {
                <li>
                  <a
                    [href]="social[item.key]"
                    class="group relative inline-flex items-center text-sm text-secondary-text transition-colors hover:text-primary-text"
                    rel="noopener noreferrer"
                    target="_blank"
                  >
                    {{ item.label }}
                    <span
                      class="absolute -bottom-0.5 left-0 h-px w-full origin-left scale-x-0 bg-accent-bright transition-transform duration-300 ease-out group-hover:scale-x-100"
                    ></span>
                  </a>
                </li>
              }
            </ul>
          </div>
        }
      </div>
    </div>

    <div class="mt-12 flex flex-col gap-4 border-t border-border pt-6 sm:flex-row sm:items-center sm:justify-between">
      <p class="text-xs text-muted-text">© {{ year }} letusdeliver</p>
      <div class="flex gap-6">
        <a routerLink="/privacy" class="text-xs text-muted-text transition-colors hover:text-secondary-text">Privacy</a>
        <a routerLink="/terms" class="text-xs text-muted-text transition-colors hover:text-secondary-text">Terms</a>
      </div>
    </div>
  </div>
</footer>
