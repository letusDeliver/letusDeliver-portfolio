<section class="py-20 sm:py-28">
  <div class="container-page">
    <app-section-heading eyebrow="How we think" heading="Engineering with intent." />

    <div class="mt-14 grid gap-px overflow-hidden rounded-2xl border border-border bg-border sm:grid-cols-2 lg:grid-cols-4">
      @for (principle of principles; track principle.index; let i = $index) {
        <div appReveal [appRevealDelay]="i * 70" class="bg-surface p-8">
          <p class="font-display text-sm font-semibold text-muted-text">{{ principle.index }}</p>
          <h3 class="mt-4 font-display text-lg font-semibold text-primary-text">{{ principle.title }}</h3>
          <p class="mt-3 text-sm leading-relaxed text-secondary-text">{{ principle.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
