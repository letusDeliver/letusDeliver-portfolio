<section class="border-t border-border bg-surface/40 py-20 sm:py-28">
  <div class="container-page">
    <app-section-heading eyebrow="Why letusdeliver" heading="Small by design. Serious about engineering." align="center" />

    <div class="mx-auto mt-14 grid max-w-4xl gap-6 sm:grid-cols-2">
      @for (point of points; track point.title; let i = $index) {
        <div appReveal [appRevealDelay]="i * 70" class="card-interactive rounded-2xl border border-border bg-surface p-6 shadow-card">
          <h3 class="font-display text-base font-semibold text-primary-text">{{ point.title }}</h3>
          <p class="mt-2 text-sm leading-relaxed text-secondary-text">{{ point.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
