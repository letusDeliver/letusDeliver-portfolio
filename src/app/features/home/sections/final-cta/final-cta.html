<section class="relative overflow-hidden py-24 sm:py-32">
  <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-accent/10 via-transparent to-transparent" aria-hidden="true"></div>

  <div appReveal class="container-page relative text-center">
    <h2 class="text-fluid-display font-display font-semibold text-primary-text">Have a project in mind?</h2>
    <p class="mx-auto mt-4 max-w-xl text-lg text-secondary-text">
      Tell us what you're building. We'll figure out the engineering.
    </p>

    <div class="mt-10 flex justify-center">
      <app-button link="/start-a-project" size="lg" (click)="onStartProjectClick()">
        Start a Project →
      </app-button>
    </div>

    <p class="mt-16 font-display text-sm font-semibold uppercase tracking-[0.3em] text-muted-text">
      Think. Build. Deliver.
    </p>
  </div>
</section>
