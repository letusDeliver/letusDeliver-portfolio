<section class="border-t border-border bg-surface/40 py-20 sm:py-28">
  <div class="container-page">
    <app-section-heading eyebrow="Insights" heading="Ideas, engineering and things we're learning." />

    <div class="mt-14 grid gap-6 sm:grid-cols-3">
      @for (article of articles; track article.slug; let i = $index) {
        <a
          appReveal
          [appRevealDelay]="i * 70"
          [routerLink]="['/insights', article.slug]"
          class="group flex flex-col rounded-2xl border border-border bg-surface p-6"
        >
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wider text-accent-bright">{{ article.category }}</span>
            @if (article.placeholder) {
              <span class="rounded-full border border-border px-2 py-0.5 text-[10px] uppercase tracking-wider text-muted-text">Coming soon</span>
            }
          </div>
          <h3 class="mt-3 font-display text-base font-semibold text-primary-text">{{ article.title }}</h3>
          <p class="mt-2 flex-1 text-sm leading-relaxed text-secondary-text">{{ article.excerpt }}</p>
        </a>
      }
    </div>
  </div>
</section>
