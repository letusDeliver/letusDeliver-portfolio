<section class="border-t border-border bg-surface/40 py-20 sm:py-28">
  <div class="container-page">
    <app-section-heading
      eyebrow="Who we are"
      heading="Two engineers. One mission."
      description="letusdeliver was founded by two software engineers who wanted to build products with strong engineering, direct communication and a focus on outcomes."
    />

    <div class="mt-14 grid gap-6 sm:grid-cols-2">
      @for (founder of founders; track founder.slug; let i = $index) {
        <a
          appReveal
          [appRevealDelay]="i * 90"
          [routerLink]="['/about', founder.slug]"
          class="group flex flex-col gap-5 rounded-2xl border border-border bg-surface p-8 shadow-card transition-colors hover:border-accent/50 sm:flex-row sm:items-start"
        >
          <div class="flex-none">
            @if (founder.photoUrl) {
              <img
                [src]="founder.photoUrl"
                [alt]="founder.name"
                width="144"
                height="144"
                class="h-36 w-36 rounded-full object-cover"
              />
            } @else {
              <div class="flex h-36 w-36 items-center justify-center rounded-full bg-elevated font-display text-3xl font-semibold text-accent-bright">
                {{ founder.name.charAt(0) }}
              </div>
            }
          </div>
          <div class="flex flex-col">
            <h3 class="font-display text-xl font-semibold text-primary-text">{{ founder.name }}</h3>
            <p class="mt-1 text-sm font-medium text-accent-bright">{{ founder.role }}</p>
            <p class="mt-3 text-sm leading-relaxed text-secondary-text">{{ founder.expertise.slice(0, 3).join(' · ') }}</p>
            <span class="mt-5 inline-flex items-center text-sm font-medium text-primary-text opacity-0 transition-opacity group-hover:opacity-100">
              View profile →
            </span>
          </div>
        </a>
      }
    </div>
  </div>
</section>
