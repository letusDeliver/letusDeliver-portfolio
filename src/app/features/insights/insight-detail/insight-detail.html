@if (article(); as article) {
  <article class="py-16 sm:py-24">
    <div class="container-page max-w-2xl">
      <a routerLink="/insights" class="text-sm text-secondary-text hover:text-primary-text">← Back to insights</a>

      <p class="mt-6 text-xs font-semibold uppercase tracking-wider text-accent-bright">{{ article.category }}</p>
      <h1 class="mt-3 text-fluid-display font-display font-semibold text-primary-text">{{ article.title }}</h1>

      @if (article.placeholder) {
        <div class="mt-8 rounded-xl border border-border bg-surface p-6">
          <p class="text-sm font-semibold uppercase tracking-wider text-muted-text">Coming soon</p>
          <p class="mt-2 leading-relaxed text-secondary-text">{{ article.excerpt }}</p>
        </div>
      } @else {
        <p class="mt-6 text-sm text-muted-text">{{ article.author }} · {{ article.date }}</p>
        <div class="mt-8 max-w-none leading-relaxed text-secondary-text">{{ article.content }}</div>
      }
    </div>
  </article>
} @else {
  <div class="container-page py-24 text-center">
    <h1 class="font-display text-2xl font-semibold text-primary-text">Article not found</h1>
    <a routerLink="/insights" class="mt-6 inline-block text-accent-bright">← Back to insights</a>
  </div>
}
